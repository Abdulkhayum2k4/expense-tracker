# Full stack:      docker compose up --build      -> http://localhost:8080
# Database only:   docker compose up mongo        -> mongodb://localhost:27018
#                  (for `fastapi dev` + `npm run dev`; set MONGODB_URL in backend/.env)
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      # Localhost only (this Mongo has no password), and 27018 so it doesn't
      # clash with a MongoDB already installed on the machine (27017).
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: expense_tracker
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file next to docker-compose.yml}
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
