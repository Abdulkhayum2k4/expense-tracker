# Render Blueprint for the API. In Render: New -> Blueprint -> pick this repo.
# See DEPLOY.md for the full walkthrough.
services:
  - type: web
    name: expense-tracker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONGODB_URL
        sync: false # you paste the Atlas connection string when creating the Blueprint
      - key: MONGODB_DB
        value: expense_tracker
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
